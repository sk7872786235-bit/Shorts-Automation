name: YouTube Shorts Automation

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    # This squashes the Node 20 deprecation warning
    env:
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

    steps:
    # Upgraded to v4 to use newer Node versions
    - uses: actions/checkout@v4
    
    # The new INSTANT FFmpeg install - no third-party actions required
    - name: Install FFmpeg (Instant Static Build)
      run: |
        wget -q https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz
        tar -xf ffmpeg-release-amd64-static.tar.xz
        sudo cp ffmpeg-*-static/ffmpeg /usr/local/bin/
        sudo cp ffmpeg-*-static/ffprobe /usr/local/bin/
        
    - name: Install Fonts for FFmpeg
      run: |
        sudo apt-get update
        sudo apt-get install -y fonts-dejavu fonts-noto-color-emoji
      
    # Upgraded to v5 to use newer Node versions
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        
    - name: Install dependencies
      run: pip install -r requirements.txt
      
    - name: Run Shorts Automation
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        GDRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
        YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
        YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
        YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      run: python run.py
