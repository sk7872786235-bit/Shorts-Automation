name: Automated YouTube Shorts Publisher

on:
  schedule:
    # Runs automatically every 1 hour (at minute 0) - Zero Quota with YT_COOKIES!
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry Run Mode (Test without actually uploading to YouTube)'
        required: false
        type: boolean
        default: false
      force_video_id:
        description: 'Specific YouTube Video ID to cut from (Leave blank for auto-selection)'
        required: false
        type: string
        default: ''
      privacy_status:
        description: 'Upload Privacy'
        required: false
        type: choice
        options:
          - public
          - unlisted
          - private
        default: public

permissions:
  contents: write

jobs:
  publish_short:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      # ⚡ Instant FFmpeg setup (Reduces 15 mins to ~1 second)
      - name: 🎬 Set up FFmpeg (Instant)
        uses: FedericoCarboni/setup-ffmpeg@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 📦 Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🚀 Run Shorts Automation Pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YT_CHANNEL_ID: ${{ secrets.YT_CHANNEL_ID }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
        run: |
          ARGS=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          if [ -n "${{ github.event.inputs.force_video_id }}" ]; then
            ARGS="$ARGS --force-video-id ${{ github.event.inputs.force_video_id }}"
          fi
          if [ -n "${{ github.event.inputs.privacy_status }}" ]; then
            ARGS="$ARGS --privacy ${{ github.event.inputs.privacy_status }}"
          fi
          
          echo "Executing: python run.py $ARGS"
          python run.py $ARGS

      - name: 💾 Commit & Push History (Prevents Duplicate Content)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add history.json
          if git diff --staged --quiet; then
            echo "No changes in history.json to commit."
          else
            git commit -m "🤖 Auto-update Shorts history (avoid duplicate segments) [skip ci]"
            git push
          fi
