name: Auto Shorts Bot
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          
      - name: Install FFmpeg & Python Dependencies
        # Pinned youtube-transcript-api to 0.6.3 to bypass their breaking update
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          pip install yt-dlp youtube-transcript-api==0.6.3 google-genai google-api-python-client google-auth feedparser
          
      - name: Run Automation Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YT_CHANNEL_ID: ${{ secrets.YT_CHANNEL_ID }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
        run: python run.py
        
      - name: Save state to prevent duplicate uploads
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          touch processed.txt 
          git add processed.txt
          git commit -m "chore: record processed video [skip ci]" || echo "No changes to commit"
          git push
