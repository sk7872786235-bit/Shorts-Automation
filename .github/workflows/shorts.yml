name: 24/7 Autonomous Shorts Engine

on:
  workflow_dispatch:
  schedule:
    - cron: '0 * * * *'

permissions: # IMPORTANT: Required to push history.json
  contents: write

jobs:
  run-shorts-engine:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout
        uses: actions/checkout@v4

      - name: 2. Setup Node.js (Required for yt-dlp JS runtime)
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 3. Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 4. Setup FFmpeg
        uses: FedericoCarboni/setup-ffmpeg@v3

      - name: 5. Install Dependencies
        run: |
          pip install yt-dlp faster-whisper google-api-python-client google-auth-oauthlib google-auth
          sudo apt-get install -y fonts-liberation fonts-dejavu-core

      - name: 6. Inject Cookies
        run: echo "${{ secrets.YT_COOKIES }}" > cookies.txt

      - name: 7. Run Pipeline
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_CHANNEL_ID: ${{ secrets.YT_CHANNEL_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python run.py --cookies cookies.txt

      - name: 8. Commit History
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add history.json || echo "No history.json to add"
          git commit -m "update history" || echo "No changes"
          git push
